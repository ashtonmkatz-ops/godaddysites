<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flash Games</title>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>
  <style>
    :root { color-scheme: dark; font: 16px Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #121212; color: #eee; }
    header { padding: 1rem; background: #202020; }
    #search { box-sizing: border-box; width: min(100%, 32rem); padding: .7rem; color: inherit; background: #303030; border: 1px solid #555; border-radius: 5px; }
    #status { padding: 1rem 1rem 0; color: #bbb; }
    #games { padding: 1rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .6rem; }
    #games button, #close { text-align: left; padding: .8rem; color: inherit; background: #242424; border: 1px solid #444; border-radius: 5px; cursor: pointer; overflow-wrap: anywhere; }
    #games button:hover, #close:hover { background: #343434; }
    #player { display: none; position: fixed; inset: 0; z-index: 2; background: #000; }
    #flash-container { position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%); width: min(100vw, 183.33vh); height: min(100vh, 54.55vw); background: #000; }
    ruffle-player { display: block; width: 100%; height: 100%; background: #000; }
    #close { position: absolute; top: .75rem; right: .75rem; z-index: 3; }
    #playing { position: absolute; top: .9rem; left: 1rem; z-index: 3; margin: 0; color: #ddd; }
  </style>
</head>
<body>
  <header><input id="search" type="search" placeholder="Search Flash games…" aria-label="Search Flash games"></header>
  <div id="status">Loading catalog…</div>
  <main id="games"></main>
  <section id="player" aria-label="Flash game player">
    <p id="playing"></p>
    <button id="close" type="button">Close</button>
    <div id="flash-container"></div>
  </section>
  <script>
    const search = document.querySelector('#search');
    const gamesEl = document.querySelector('#games');
    const statusEl = document.querySelector('#status');
    const playerOverlay = document.querySelector('#player');
    const flashContainer = document.querySelector('#flash-container');
    let games = [];

    fetch('./catalog.json').then(response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }).then(catalog => {
      games = catalog;
      render();
    }).catch(error => {
      statusEl.textContent = `Could not load catalog.json: ${error.message}`;
    });

    function render() {
      const query = search.value.trim().toLowerCase();
      const filtered = games.filter(game => game.name.toLowerCase().includes(query));
      gamesEl.replaceChildren(...filtered.map(game => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = game.name;
        button.addEventListener('click', () => launch(game));
        return button;
      }));
      statusEl.textContent = `${filtered.length} of ${games.length} games`;
    }

    function launch(game) {
      playerOverlay.style.display = 'block';
      document.querySelector('#playing').textContent = game.name;
      flashContainer.replaceChildren();
      const ruffle = window.RufflePlayer?.newest();
      if (!ruffle) {
        flashContainer.textContent = 'Ruffle failed to load.';
        return;
      }
      const gamePlayer = ruffle.createPlayer();
      gamePlayer.setAttribute('aria-label', game.name);
      flashContainer.append(gamePlayer);
      const gameUrl = game.path.split('/').map(encodeURIComponent).join('/');
      gamePlayer.load(gameUrl);
    }

    function closePlayer() {
      playerOverlay.style.display = 'none';
      flashContainer.replaceChildren();
    }
    search.addEventListener('input', render);
    document.querySelector('#close').addEventListener('click', closePlayer);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closePlayer();
    });
  </script>
</body>
</html>
