<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Catalog</title>
  <style>
    :root { color-scheme: dark; font: 16px Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #121212; color: #eee; }
    header { padding: 1rem; background: #202020; display: flex; gap: .75rem; flex-wrap: wrap; }
    input, select { padding: .65rem; color: inherit; background: #303030; border: 1px solid #555; border-radius: 5px; }
    #games { padding: 1rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .6rem; }
    button { text-align: left; padding: .8rem; color: inherit; background: #242424; border: 1px solid #444; border-radius: 5px; cursor: pointer; overflow-wrap: anywhere; }
    button:hover { background: #343434; }
    #status { padding: 1rem; color: #bbb; }
    #player { display: none; position: fixed; inset: 0; z-index: 2; background: #000; }
    #game { width: 100%; height: 100%; }
    #close { position: absolute; top: .5rem; right: .5rem; z-index: 3; padding: .7rem; }
  </style>
</head>
<body>
  <header>
    <input id="search" type="search" placeholder="Search games…" aria-label="Search games">
    <select id="system" aria-label="Filter by system"><option value="">All systems</option></select>
  </header>
  <div id="status">Loading catalog…</div>
  <main id="games"></main>
  <section id="player" aria-label="Game player">
    <button id="close" type="button">Close</button>
    <div id="game"></div>
  </section>
  <script>
    const search = document.querySelector('#search');
    const systemSelect = document.querySelector('#system');
    const gamesEl = document.querySelector('#games');
    const statusEl = document.querySelector('#status');
    const player = document.querySelector('#player');
    let games = [];

    fetch('./catalog.json').then(response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }).then(catalog => {
      games = Object.entries(catalog).flatMap(([system, entries]) =>
        entries.map(entry => ({ ...entry, system })));
      [...new Set(games.map(game => game.system))].sort().forEach(system => {
        const option = document.createElement('option');
        option.value = system;
        option.textContent = system.toUpperCase();
        systemSelect.append(option);
      });
      statusEl.textContent = `${games.length} games`;
      render();
    }).catch(error => {
      statusEl.textContent = `Could not load catalog.json: ${error.message}`;
    });

    function render() {
      const query = search.value.trim().toLowerCase();
      const filtered = games.filter(game =>
        (!systemSelect.value || game.system === systemSelect.value) &&
        game.name.toLowerCase().includes(query));
      gamesEl.replaceChildren(...filtered.map(game => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = `${game.name} (${game.system.toUpperCase()})`;
        button.addEventListener('click', () => launch(game));
        return button;
      }));
      statusEl.textContent = `${filtered.length} games`;
    }

    function launch(game) {
      player.style.display = 'block';
      window.EJS_player = '#game';
      window.EJS_core = game.core;
      window.EJS_gameName = game.name;
      window.EJS_color = '#0064ff';
      window.EJS_startOnLoaded = true;
      window.EJS_pathtodata = '/emu/';
      window.EJS_gameUrl = game.link;
      const loader = document.createElement('script');
      loader.src = '/emu/loader.js';
      document.body.append(loader);
    }

    function closePlayer() {
      player.style.display = 'none';
      document.querySelector('#game').replaceChildren();
      location.reload();
    }
    search.addEventListener('input', render);
    systemSelect.addEventListener('change', render);
    document.querySelector('#close').addEventListener('click', closePlayer);
  </script>
</body>
</html>
