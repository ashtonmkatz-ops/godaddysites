
<!DOCTYPE html>
<html>
<head>
  <script src="coi-serviceworker.min.js"></script>
  <script>
    alert('There is about 1GB of data to load. It might take a minute on the first go!');
    alert('If you are using a chromebook or any low-end or low-memory device it may not work or may crash. Please try on a more powerful device if you have issues!');
    window.gameconfig = {
      name: "Little Big Planet",
      url: "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/stunning-engine/LittleBigPlanet_USA.iso",
      core: "psp",
      min: 0,
      max: 71
    };
  </script>
  <script>
    async function mergeFiles(fileParts, cb) {
      const buffers = [];
      let loaded = 0;

      for (const partUrl of fileParts) {
        try {
          const response = await fetch(partUrl, { mode: 'cors' });
          if (!response.ok) throw new Error(`Network error on ${partUrl}`);
          
          const data = await response.arrayBuffer();
          buffers.push(data);
          
          loaded++;
          cb(loaded);
          
          if (loaded % 10 === 0) {
            await new Promise(resolve => setTimeout(resolve, 0));
          }
        } catch (err) {
          console.error("Download failed:", err);
          throw err;
        }
      }

      const mergedBlob = new Blob(buffers, { type: "application/octet-stream" });

      buffers.length = 0; 
      
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) {
        let padded = String(i).padStart(2, '0');
        parts.push(file + ".part" + padded);
      }
      return parts;
    }
  </script>
  <style>
    body, html {
      margin: 0; padding: 0; display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%; background-color: #121212; color: white; font-family: Arial, sans-serif;
    }
    #game-container { text-align: center; width: 100%; height: 100%; }
    #loading-progress {
      font-size: 18px; margin-top: 20px; padding: 10px;
      background: rgba(255, 255, 255, 0.1); border-radius: 8px; display: inline-block;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="game"></div>
    <div id="loading-progress">Loading: 0/0</div>
    <div id="first-time">First-time loading may take longer...</div>
  </div>
  <script>
    var parts = getParts(
      window.gameconfig.url,
      window.gameconfig.min,
      window.gameconfig.max
    );
    var totalParts = parts.length;

    function updateLoadingProgress(loaded) {
      const progressElement = document.getElementById("loading-progress");
      progressElement.textContent = `Loading: ${loaded}/${totalParts}`;
    }

    mergeFiles(parts, updateLoadingProgress)
      .then((gameUrl) => {
        document.getElementById("loading-progress").remove();
        document.getElementById("first-time").remove();
        
        EJS_player = "#game";
        EJS_core = window.gameconfig.core;
        EJS_gameName = window.gameconfig.name;
        EJS_color = "#0064ff";
        EJS_startOnLoaded = true;
        EJS_pathtodata = "https://cdn.jsdelivr.net/gh/ashtonmkatz-ops/emu@master/";
        EJS_gameUrl = gameUrl;
        EJS_threads = true;

        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/gh/ashtonmkatz-ops/emu@master/loader.js";
        script.crossOrigin = "anonymous";
        document.body.appendChild(script);
      })
      .catch((error) => {
        console.error(error);
        document.getElementById("loading-progress").textContent = "Error loading game.";
      });
  </script>
</body>
</html>
